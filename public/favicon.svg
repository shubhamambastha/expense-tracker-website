<svg xmlns="http://www.w3.org/2000/svg" viewBox="215 220 820 852">
  <!-- Jebbo mark, traced from the app icon: a sun rising out of a smiling bowl -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF23A"/>
      <stop offset="1" stop-color="#FF6F00"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5C0"/>
      <stop offset="0.55" stop-color="#00D0D8"/>
      <stop offset="1" stop-color="#005CFF"/>
    </linearGradient>
    <path id="bowl-shape" d="M235,700 V550 Q235,480 300,482 Q322,484 342,495 C440,545 520,562 600,562 C720,562 820,522 900,478 Q925,462 950,462 Q1015,466 1015,540 V700 A390,352 0 0 1 235,700 Z"/>
    <!-- cuts a gap between the sun and the bowl that stays transparent on any background -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="215" y="220" width="820" height="852">
      <rect x="215" y="220" width="820" height="852" fill="#fff"/>
      <use href="#bowl-shape" fill="#000" stroke="#000" stroke-width="44"/>
    </mask>
  </defs>
  <circle cx="621" cy="495" r="255" fill="url(#sun)" mask="url(#gap)"/>
  <use href="#bowl-shape" fill="url(#bowl)"/>
  <circle cx="853" cy="677" r="57" fill="#fff"/>
</svg>
